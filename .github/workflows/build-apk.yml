#
# 云端把 Web 前端（Vite）打包进 Capacitor 的安卓壳，一次同时产出
# debug 与 release 两个 APK，两者使用同一套固定 keystore 签名
# （所以签名不随构建机变化，两个包可以互相覆盖升级）。
#
# 触发：手动（Actions → Build APK → Run workflow）或推送到 main。
# 产物：两个独立 artifact（Actions 页面各一条）
#   sekai-stickers-debug-<sha>    → sekai-stickers-debug-<sha>.apk
#   sekai-stickers-release-<sha>  → sekai-stickers-release-<sha>.apk
#
# 需要的仓库 Secrets（Settings → Secrets and variables → Actions）：
#   SEKAI_KEYSTORE_BASE64     keystore 的 base64（base64 -w0 sekai-release.jks）
#   SEKAI_KEYSTORE_PASSWORD   keystore 口令
#   SEKAI_KEY_ALIAS           key 别名
#   SEKAI_KEY_PASSWORD        key 口令（PKCS12 下与 keystore 口令相同）
#   SEKAI_KEYSTORE_FILENAME   落盘文件名，默认 sekai-release.jks（可选）
#

name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble debug + release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      # @25-ji-code-de/sekai-auth 是 github: 依赖：npm 会解析成 ssh://git@github.com/...
      # runner 上统一改走 https，避免 SSH 端口/密钥问题。
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: url.https://github.com/.insteadOf
      GIT_CONFIG_VALUE_0: ssh://git@github.com/
      # 固定签名：keystore 文件由下面 decode 步骤写入并导出 SEKAI_KEYSTORE_FILE
      SEKAI_KEYSTORE_FILENAME: ${{ secrets.SEKAI_KEYSTORE_FILENAME || 'sekai-release.jks' }}
      SEKAI_KEYSTORE_PASSWORD: ${{ secrets.SEKAI_KEYSTORE_PASSWORD }}
      SEKAI_KEY_ALIAS: ${{ secrets.SEKAI_KEY_ALIAS }}
      SEKAI_KEY_PASSWORD: ${{ secrets.SEKAI_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # ubuntu-latest 自带 Android SDK（ANDROID_HOME=/usr/local/lib/android/sdk、
      # cmdline-tools + 各版本 platform/build-tools），因此不需要 android-actions/setup-android
      # （v3 会去装已下架的 "tools" 包而直接报错）。这里只做一次可见性检查。
      - name: Check Android SDK on runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Install npm dependencies
        run: npm ci --legacy-peer-deps

      - name: Type-check (tsc --noEmit)
        run: npm run type-check

      - name: Build web bundle for Android + sync into native project
        env:
          # SEKAI Pass 公共客户端的 client_id（在开放平台 /apps 自助签发）。
          # 没配这个仓库变量时是空串：壳照样能装能跑，只是点登录会报
          # clientId is required —— 见 BUILD-ANDROID.md 的「已知限制」。
          VITE_OAUTH_CLIENT_ID: ${{ vars.SEKAI_OAUTH_CLIENT_ID }}
        run: npm run cap:sync

      # 图标 / 启动图（android/app/src/main/res/mipmap-*、drawable*/splash.png）
      # 已随仓库提交。品牌图改了就在本机跑 `node scripts/generate-android-icons.mjs`
      # 重新生成并提交（CI 不再依赖 Pillow）。

      - name: Prepare fixed signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SEKAI_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          missing=0
          for name in KEYSTORE_BASE64 SEKAI_KEYSTORE_PASSWORD SEKAI_KEY_ALIAS SEKAI_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::缺少 secret ${name}（在仓库 Actions secrets 里配置后重跑）"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          KEYSTORE_PATH="$GITHUB_WORKSPACE/android/$SEKAI_KEYSTORE_FILENAME"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "SEKAI_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "keystore 已写入 $KEYSTORE_PATH ($(stat -c %s "$KEYSTORE_PATH") bytes)"
          # 指纹守卫：确认注入的确实是预期的固定 keystore（换错/被替换会立刻失败）
          KEYSTORE_SHA=$(sha256sum "$KEYSTORE_PATH" | awk '{print $1}')
          echo "keystore sha256=$KEYSTORE_SHA"
          if [ "$KEYSTORE_SHA" != "f6b518abad7bff23d1479efa94393584f91bfc816de478afc90f28b9e9bc2410" ]; then
            echo "::error::keystore 与预期的固定签名文件不一致，拒绝用它签名"
            exit 1
          fi
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$SEKAI_KEYSTORE_PASSWORD" -alias "$SEKAI_KEY_ALIAS" > /dev/null
          echo "keystore 校验通过：alias=$SEKAI_KEY_ALIAS"
          echo "::add-mask::$SEKAI_KEYSTORE_PASSWORD"

      - name: Assemble debug + release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Collect APKs
        id: collect
        run: |
          set -euo pipefail
          SHA_SHORT=$(git rev-parse --short HEAD)
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "out/sekai-stickers-debug-${SHA_SHORT}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk \
             "out/sekai-stickers-release-${SHA_SHORT}.apk"
          ls -lh out/
          # 两个包作为两个独立 artifact 上传（Actions 页面上能看到两条产物）
          echo "debug_name=sekai-stickers-debug-${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "release_name=sekai-stickers-release-${SHA_SHORT}" >> "$GITHUB_OUTPUT"

      - name: Verify both APKs share one signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER=$(ls /usr/local/lib/android/sdk/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          fi
          if [ -z "$APKSIGNER" ]; then
            echo "::error::找不到 apksigner，无法校验签名"
            exit 1
          fi
          echo "apksigner=$APKSIGNER"
          "$APKSIGNER" version || true

          # 注意：不同 build-tools 的 apksigner 输出格式不同
          #   34.x: "Signer #1 certificate SHA-256 digest: <hex>"
          #   37.x: "V3.0 Signer: certificate SHA-256 digest: <hex>"
          # 所以这里只按字段名匹配，别绑定前缀。
          DIGESTS_FILE=$(mktemp)
          for apk in out/*.apk; do
            echo "== $apk =="
            set +e
            RAW=$("$APKSIGNER" verify --print-certs "$apk" 2>&1)
            RC=$?
            set -e
            if [ "$RC" -ne 0 ]; then
              echo "$RAW" | head -30
              echo "::error::$apk 验签失败（apksigner exit=$RC）"
              exit 1
            fi
            echo "$RAW" | grep -iE "signer.*certificate.*(DN|SHA-256)" | sort -u
            echo "$RAW" | grep -iE "certificate SHA-256 digest:" | awk -F': ' '{print $NF}' | sort -u >> "$DIGESTS_FILE"
          done

          UNIQ=$(sort -u "$DIGESTS_FILE" | sed '/^$/d')
          echo "去重后的签名（SHA-256）："
          echo "$UNIQ"
          if [ "$(echo "$UNIQ" | sed '/^$/d' | wc -l)" -ne 1 ]; then
            echo "::error::debug 与 release 签名不一致"
            exit 1
          fi
          echo "✓ debug 与 release 签名一致"

      # 双保险：确认待上传目录里只有 APK，没有 keystore / 口令文件混进去
      - name: Assert no signing material in upload dir
        run: |
          echo "upload dir 内容："
          ls -la out/
          if find out -type f ! -name '*.apk' | grep -q .; then
            echo "::error::out/ 里出现了非 APK 文件，拒绝上传"
            find out -type f ! -name '*.apk'
            exit 1
          fi
          if find . -path ./node_modules -prune -o \( -name '*.jks' -o -name '*.keystore' -o -name 'keystore.properties' \) -print | grep -q keystore; then
            echo "::warn::工作区里存在 keystore 文件（仅存在于本次 runner，不会进 artifact）"
          fi
          echo "✓ 上传目录只有 APK"

      # 两个包各上传一次，在 Actions 页面就是两条独立产物
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.collect.outputs.debug_name }}
          path: out/sekai-stickers-debug-*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.collect.outputs.release_name }}
          path: out/sekai-stickers-release-*.apk
          if-no-files-found: error
          retention-days: 30
