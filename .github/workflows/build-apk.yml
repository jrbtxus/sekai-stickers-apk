#
# 云端把 Web 前端（Vite）打包进 Capacitor 的安卓壳，产出可直接安装的 APK。
#
# 触发：手动（Actions → Build APK → Run workflow）或推送到 main。
# 产物：Actions 页面上的 artifact「sekai-stickers-debug-<sha>」，内含 app-debug.apk。
#
# 说明：Electron 没有 Android 运行时（Chromium+Node 桌面二进制无法装进 APK），
# 所以安卓端用 Capacitor（系统 WebView + 原生插件）承载同一份 Web 产物。

name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      # @25-ji-code-de/sekai-auth 是 github: 依赖：npm 会解析成 ssh://git@github.com/...
      # runner 上统一改走 https，避免 SSH 端口/密钥问题。
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: url.https://github.com/.insteadOf
      GIT_CONFIG_VALUE_0: ssh://git@github.com/

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # ubuntu-latest 自带 Android SDK（ANDROID_HOME=/usr/local/lib/android/sdk、
      # cmdline-tools + 各版本 platform/build-tools），因此不需要 android-actions/setup-android
      # （v3 会去装已下架的 "tools" 包而直接报错）。这里只做一次可见性检查。
      - name: Check Android SDK on runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Install npm dependencies
        run: npm ci --legacy-peer-deps

      - name: Type-check (tsc --noEmit)
        run: npm run type-check

      - name: Build web bundle for Android + sync into native project
        run: npm run cap:sync

      # 图标 / 启动图（android/app/src/main/res/mipmap-*、drawable*/splash.png）
      # 已随仓库提交。品牌图改了就在本机跑 `node scripts/generate-android-icons.mjs`
      # 重新生成并提交（CI 不再依赖 Pillow）。

      - name: Assemble debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Collect APK
        id: collect
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          NAME="sekai-stickers-debug-${SHA_SHORT}"
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/${NAME}.apk"
          ls -lh out/
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.collect.outputs.name }}
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30
